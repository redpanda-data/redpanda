syntax = "proto3";

package redpanda.core.admin.v2;

// Centralized error reason codes for the Admin API
// Used in google.rpc.ErrorInfo.reason field
// Format: REASON_[A-Z0-9_]+
enum Reason {
  REASON_UNSPECIFIED = 0;

  // Shadow Link error reasons (1000-1099)
  // Connection and verification errors
  REASON_SHADOW_LINK_API_VERSION_UNSUPPORTED = 1000;
  REASON_SHADOW_LINK_BROKER_UNREACHABLE = 1001;
  REASON_SHADOW_LINK_CLUSTER_UNREACHABLE = 1002;
  REASON_SHADOW_LINK_BROKER_VERIFICATION_FAILED = 1003;
  REASON_SHADOW_LINK_CONNECTION_FAILED = 1004;
  REASON_SHADOW_LINK_VERIFICATION_UNKNOWN_ERROR = 1005;

  // Lifecycle errors
  REASON_SHADOW_LINK_CREATION_FAILED = 1010;
  REASON_SHADOW_LINK_NOT_FOUND = 1011;
  REASON_SHADOW_LINK_SERVICE_SHUTTING_DOWN = 1012;
  REASON_SHADOW_LINK_RPC_ERROR = 1013;
  REASON_SHADOW_LINK_INVALID_CONFIGURATION = 1014;

  // Mirror topic errors
  REASON_SHADOW_TOPIC_ALREADY_MIRRORED = 1020;
  REASON_SHADOW_TOPIC_MIRRORED_BY_OTHER_LINK = 1021;
  REASON_SHADOW_TOPIC_NOT_MIRRORED = 1022;
  REASON_SHADOW_LINK_HAS_ACTIVE_TOPICS = 1023;
  REASON_SHADOW_TOPIC_DOES_NOT_EXIST = 1024;
  REASON_SHADOW_TOPIC_METADATA_STALE = 1025;

  // Task errors
  REASON_SHADOW_LINK_INVALID_TASK_STATE = 1030;
  REASON_SHADOW_LINK_TASK_NOT_RUNNING = 1031;
  REASON_SHADOW_LINK_TASK_ALREADY_RUNNING = 1032;
  REASON_SHADOW_LINK_TASK_START_FAILED = 1033;
  REASON_SHADOW_LINK_TASK_CREATION_FAILED = 1034;
  REASON_SHADOW_LINK_TASK_ALREADY_REGISTERED = 1035;
  REASON_SHADOW_LINK_TASK_STOP_FAILED = 1036;
  REASON_SHADOW_LINK_TASK_PAUSE_FAILED = 1037;

  // Other shadow link errors
  REASON_SHADOW_LINK_FEATURE_DISABLED = 1040;
  REASON_SHADOW_LINK_LICENSE_REQUIRED = 1041;
  REASON_SHADOW_LINK_LIMIT_REACHED = 1042;
  REASON_SHADOW_LINK_SERVICE_NOT_READY = 1043;
  REASON_SHADOW_LINK_REMOTE_API_UNSUPPORTED = 1044;
}
