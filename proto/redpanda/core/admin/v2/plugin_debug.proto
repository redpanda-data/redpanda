syntax = "proto3";

package redpanda.core.admin.v2;

import "proto/redpanda/core/pbgen/options.proto";
import "proto/redpanda/core/pbgen/rpc.proto";

option (pbgen.cpp_namespace) = "proto::admin";

// PluginDebugService exposes low-level diagnostic operations for the plugin
// subsystem. These endpoints are intended for operators and support tooling;
// the data returned may be inconsistent across partitions at any given moment.
service PluginDebugService {
    // ListCommittedOffsets
    //
    // Returns the committed input-topic offsets for every transform/partition
    // pair. The snapshot may be inconsistent across partitions.
    rpc ListCommittedOffsets(ListCommittedOffsetsRequest)
        returns (ListCommittedOffsetsResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // GarbageCollectOffsets
    //
    // Deletes committed offsets that belong to transforms which no longer
    // exist. Should not be called while new transforms are being deployed, as
    // the cluster-wide view of transform metadata is eventually consistent.
    rpc GarbageCollectOffsets(GarbageCollectOffsetsRequest)
        returns (GarbageCollectOffsetsResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

// CommittedOffset records the last committed input-topic offset for a
// specific transform/partition pair.
message CommittedOffset {
    // Name of the transform.
    string transform_name = 1;

    // The input-topic partition.
    int32 partition = 2;

    // The committed offset within that partition.
    int64 offset = 3;
}

// ListCommittedOffsetsRequest controls which committed offsets to return.
message ListCommittedOffsetsRequest {
    // When true, also return offsets for partitions whose transform no longer
    // exists (orphaned offsets).
    bool show_unknown = 1;
}

// ListCommittedOffsetsResponse returns all matching committed offsets.
message ListCommittedOffsetsResponse {
    repeated CommittedOffset offsets = 1;
}

// GarbageCollectOffsetsRequest has no required fields.
message GarbageCollectOffsetsRequest {}

// GarbageCollectOffsetsResponse is returned on success.
message GarbageCollectOffsetsResponse {}
