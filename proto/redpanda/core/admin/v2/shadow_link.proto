syntax = "proto3";

package redpanda.core.admin.v2;

import "proto/redpanda/pbgen/options.proto";
import "proto/redpanda/pbgen/rpc.proto";
import "proto/redpanda/core/common/acl.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option (redpanda.pbgen.cpp_namespace) = "proto::admin";

// Manage shadow links between clusters for disaster recovery.
// Shadow links replicate topics from a source cluster to a shadow cluster.
service ShadowLinkService {
    // Create a new shadow link between clusters
    rpc CreateShadowLink(CreateShadowLinkRequest)
        returns (CreateShadowLinkResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // Delete an existing shadow link
    rpc DeleteShadowLink(DeleteShadowLinkRequest)
        returns (DeleteShadowLinkResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // Get information about a specific shadow link
    rpc GetShadowLink(GetShadowLinkRequest) returns (GetShadowLinkResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // List all shadow links in the cluster
    rpc ListShadowLinks(ListShadowLinksRequest)
        returns (ListShadowLinksResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // Update an existing shadow link configuration
    rpc UpdateShadowLink(UpdateShadowLinkRequest)
        returns (UpdateShadowLinkResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // Fail over a shadow link or single shadow topic for disaster recovery
    rpc FailOver(FailOverRequest) returns (FailOverResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

/* Resources */
// Shadow link for disaster recovery between clusters.
// Manages topic and metadata replication from source to shadow cluster.
message ShadowLink {
    // Name of the shadow link
    string name = 1 [(google.api.field_behavior) = REQUIRED];
    // UUID of the shadow link
    string uid = 2 [
        (google.api.field_behavior) = OUTPUT_ONLY,
        (google.api.field_info).format = UUID4
    ];
    // Shadow link configuration
    ShadowLinkConfigurations configurations = 3;
    // Status of the shadow link
    ShadowLinkStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

/* RPC Requests and Responses */
// `CreateShadowLinkRequest` contains parameters to create a new shadow link
message CreateShadowLinkRequest {
    // Shadow link to create
    ShadowLink shadow_link = 1;
}
// `CreateShadowLinkResponse` contains the created shadow link
message CreateShadowLinkResponse {
    // Created shadow link
    ShadowLink shadow_link = 1;
}
// `DeleteShadowLinkRequest` specifies the shadow link to delete
message DeleteShadowLinkRequest {
    // Name of the link to delete
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ShadowLinkService/ShadowLink"
        }
    ];
    // By default, `DeleteShadowLink` fails if active shadow
    // topics exist. Set this flag to `true` to force deletion of the link with
    // active shadow topics.
    bool force = 2;
}
// `DeleteShadowLinkResponse` confirms shadow link deletion
message DeleteShadowLinkResponse {}
// `GetShadowLinkRequest` specifies the shadow link to retrieve
message GetShadowLinkRequest {
    // Name of the shadow link to retrieve
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ShadowLinkService/ShadowLink"
        }
    ];
}
// `GetShadowLinkResponse` contains shadow link details
message GetShadowLinkResponse {
    // Retrieved shadow link
    ShadowLink shadow_link = 1;
}
// `ListShadowLinksRequest` contains parameters for listing shadow links
message ListShadowLinksRequest {}
// `ListShadowLinksResponse` contains all shadow links in the cluster
message ListShadowLinksResponse {
    // List of shadow links
    repeated ShadowLink shadow_links = 1;
}
// `UpdateShadowLinkRequest` contains parameters to update a shadow link
message UpdateShadowLinkRequest {
    // Shadow link to update
    ShadowLink shadow_link = 1;

    // List of fields to update
    // For `field_mask` usage, see [AIP-134](https://google.aip.dev/134)
    google.protobuf.FieldMask update_mask = 2;
}
// `UpdateShadowLinkResponse` contains the updated shadow link
message UpdateShadowLinkResponse {
    // Updated shadow link
    ShadowLink shadow_link = 1;
}
// `FailOverRequest` specifies the shadow link or topic to fail over
message FailOverRequest {
    // Name of the shadow link to fail over
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ShadowLinkService/ShadowLink"
        }
    ];
    // Shadow topic name to fail over. If not set, Redpanda fails over
    // the entire shadow link
    string shadow_topic_name = 2 [(google.api.field_behavior) = OPTIONAL];
}
// `FailOverResponse` contains the failed over shadow link
message FailOverResponse {
    // Failed over shadow link
    ShadowLink shadow_link = 1;
}

/* Other Messages */
// `ShadowLinkConfigurations` contains client, sync, and security settings
message ShadowLinkConfigurations {
    // Configuration for the internal kafka client
    ShadowLinkClientOptions client_options = 1;
    // Topic metadata sync options
    TopicMetadataSyncOptions topic_metadata_sync_options = 2;
    // Consumer offset sync options
    ConsumerOffsetSyncOptions consumer_offset_sync_options = 3;
    // Security settings sync options
    SecuritySettingsSyncOptions security_sync_options = 4;
}
// `ShadowLinkClientOptions` configures the Kafka client for source cluster
// replication
message ShadowLinkClientOptions {
    // List of bootstrap servers to use
    repeated string bootstrap_servers = 1
        [(google.api.field_behavior) = REQUIRED];
    // Client ID for Kafka RPC requests sent by this cluster to the
    // source cluster
    string client_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Expected ID of the source cluster. Redpanda rejects the connection if
    // this ID does not match the actual source cluster ID. When you provide
    // this value, it must match the `ClusterId` field in the Kafka Metadata
    // response message
    string source_cluster_id = 3;
    // TLS settings
    optional TLSSettings tls_settings = 4;
    // Authentication settings
    optional AuthenticationConfiguration authentication_configuration = 5;
    // Maximum metadata age
    // Defaults to 10 seconds when you provide `0`
    int32 metadata_max_age_ms = 6;
    // Connection timeout
    // Defaults to 1 second when you provide `0`
    int32 connection_timeout_ms = 7;
    // Retry base backoff
    // Defaults to 100ms when you provide `0`
    int32 retry_backoff_ms = 8;
    // Fetch request timeout
    // Defaults to 100ms when you provide `0`
    int32 fetch_wait_max_ms = 9;
    // Fetch minimum bytes
    // Defaults to 1 byte when you provide `0`
    int32 fetch_min_bytes = 10;
    // Fetch maximum bytes
    // Defaults to 1MiB when you provide `0`
    int32 fetch_max_bytes = 11;
}
// `TopicMetadataSyncOptions` defines configuration for syncing topic metadata
message TopicMetadataSyncOptions {
    // Metadata sync frequency
    // Defaults to 30 seconds when you provide `0`
    google.protobuf.Duration interval = 1;
    // List of filters that determine which topics Redpanda automatically
    // creates as shadow topics on the shadow cluster. These filters control
    // only automatic creation and do not affect the shadow topic state after
    // creation. Redpanda rejects literal filters for `__consumer_offsets` and
    // `_redpanda.audit_log`, as well as prefix filters that match topics with
    // `_redpanda` or `__redpanda` prefixes.
    // The wildcard `*` works only for literal filters and does not match
    // topics starting with `_redpanda` or `__redpanda`. To shadow topics
    // starting with `_redpanda` or `__redpanda`, provide a literal filter.
    repeated NameFilter auto_create_shadow_topic_filters = 2;
    // List of topic properties that Redpanda syncs from the source topic.
    // Redpanda always replicates the following properties:
    // - Partition count
    // - `max.message.bytes`
    // - `cleanup.policy`
    // - `timestamp.type`
    //
    // Redpanda does not allow the following properties to be replicated. Adding
    // them to this list results in an error:
    // - `redpanda.remote.readreplica`
    // - `redpanda.remote.recovery`
    // - `redpanda.remote.allowgaps`
    // - `redpanda.virtual.cluster.id`
    // - `redpanda.leaders.preference`
    // - `redpanda.cloud_topic.enabled`
    //
    // This list contains properties in addition to the default properties
    // that Redpanda syncs. See `exclude_default`.
    repeated string synced_shadow_topic_properties = 3;
    // When false, Redpanda syncs the following topic properties by default:
    // - `compression.type`
    // - `retention.bytes`
    // - `retention.ms`
    // - `delete.retention.ms`
    // - Replication Factor
    // - `min.compaction.lag.ms`
    // - `max.compaction.lag.ms`
    //
    // When true, Redpanda syncs only the properties listed in
    // `synced_shadow_topic_properties`.
    bool exclude_default = 4;
}
// `ConsumerOffsetSyncOptions` defines configuration for syncing consumer
// offsets
message ConsumerOffsetSyncOptions {
    // Sync interval
    // Defaults to 30 seconds when you provide `0`
    google.protobuf.Duration interval = 1;
    // Whether sync is enabled
    bool enabled = 2;
    // List of consumer group name filters
    repeated NameFilter group_filters = 3;
}
// `SecuritySettingsSyncOptions` defines configuration for syncing security
// settings
message SecuritySettingsSyncOptions {
    // Sync interval
    // Defaults to 30 seconds when you provide `0`
    google.protobuf.Duration interval = 1;
    // Whether sync is enabled
    bool enabled = 2;
    // List of role name filters
    repeated NameFilter role_filters = 3;
    // List of SCRAM credential filters
    repeated NameFilter scram_cred_filters = 4;
    // List of ACL filters
    repeated ACLFilter acl_filters = 5;
}
// `TLSSettings` configures TLS security for source cluster connections
message TLSSettings {
    // Whether TLS is enabled
    bool enabled = 3;
    // Provide TLS as a set of files or PEM values
    oneof tls_settings {
        // Provide certificates and keys as files
        TLSFileSettings tls_file_settings = 1;
        // Provide certificates and keys in PEM format
        TLSPEMSettings tls_pem_settings = 2;
    }
}
// Authentication configuration. Currently supports only SASL/SCRAM
// but uses oneof for future expansion
message AuthenticationConfiguration {
    oneof authentication {
        // SASL/SCRAM configuration
        ScramConfig scram_configuration = 1;
    }
}
// `TLSFileSettings` provides TLS certificates and keys via file paths
message TLSFileSettings {
    // Path to the CA
    string ca_path = 1;
    // `key_path` and `cert_path` are optional. If you provide one, you must
    // provide both. Path to the private key
    string key_path = 2;
    // Path to the certificate
    string cert_path = 3;
}
// `TLSPEMSettings` provides TLS certificates and keys in PEM format
message TLSPEMSettings {
    // Certificate authority
    string ca = 1;
    // `key` and `cert` are optional. If you provide one, you must provide both
    // Private key
    string key = 2 [(google.api.field_behavior) = INPUT_ONLY];
    // SHA-256 hash of the key in base64 format
    string key_fingerprint = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Certificate
    string cert = 4;
}
// `ScramConfig` configures SASL/SCRAM authentication credentials
message ScramConfig {
    // SCRAM username
    string username = 1;
    // Password
    string password = 2 [(google.api.field_behavior) = INPUT_ONLY];
    // Indicates whether you set the password
    bool password_set = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Timestamp when you last set the password. Redpanda populates this field
    // only when `password_set` is `true`
    google.protobuf.Timestamp password_set_at = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];
    // SCRAM mechanism to use
    ScramMechanism scram_mechanism = 5;
}
// `NameFilter` defines filtering rules based on resource names
message NameFilter {
    // Literal or prefix
    PatternType pattern_type = 1;
    // Include or exclude
    FilterType filter_type = 2;
    // Resource name or `*`
    // If you use `*`, it must be the only character
    // and `pattern_type` must be `PATTERN_TYPE_LITERAL`
    string name = 3;
}
// `ACLFilter` defines filtering rules for access control lists
message ACLFilter {
    // Resource filter
    ACLResourceFilter resource_filter = 1;
    // Access filter
    ACLAccessFilter access_filter = 2;
}
// `ACLResourceFilter` defines filtering rules for ACL resources
message ACLResourceFilter {
    // ACL resource type to match
    common.ACLResource resource_type = 1;
    // Pattern to apply to name
    common.ACLPattern pattern_type = 2;
    // Resource name to match. When not provided, Redpanda matches all items in
    // `resource_type`. The asterisk `*` is not a wildcard but literal text that
    // matches resources specifically named `*`
    string name = 3;
}
// `ACLAccessFilter` defines filtering rules for ACL access permissions
message ACLAccessFilter {
    // Principal name. When not set, Redpanda matches all principals with the
    // specified `operation` and `permission_type`
    string principal = 1;
    // ACL operation to match
    common.ACLOperation operation = 2;
    // Permission type
    common.ACLPermissionType permission_type = 3;
    // Host to match. When not set, Redpanda matches all hosts with the
    // specified `operation` and `permission_type`. The asterisk `*` is not a
    // wildcard but literal text that matches hosts set to `*`
    string host = 4;
}
// `ShadowLinkStatus` reports the operational status of a shadow link
message ShadowLinkStatus {
    ShadowLinkState state = 1;
    // List of running task statuses
    repeated ShadowLinkTaskStatus task_statuses = 2;
    // List of shadow topic statuses
    repeated ShadowTopicStatus shadow_topic_statuses = 3;
    // List of topic properties that Redpanda syncs
    repeated string synced_shadow_topic_properties = 4;
}
// `ShadowLinkTaskStatus` reports the status of a shadow link task
message ShadowLinkTaskStatus {
    // Name of the task
    string name = 1;
    // State of the task
    TaskState state = 2;
    // Reason for the task state
    string reason = 3;
    // Broker running the task
    int32 broker_id = 4;
}
// `ShadowTopicStatus` reports the operational status of a shadow topic
message ShadowTopicStatus {
    // Name of the shadow topic
    string name = 1;
    // Topic ID of the shadow topic
    string topic_id = 2;
    // State of the shadow topic
    ShadowTopicState state = 3;
    // List of partition information for the shadow topic
    repeated TopicPartitionInformation partition_information = 4;
}
// `TopicPartitionInformation` provides status details for topic partitions
message TopicPartitionInformation {
    // Partition ID
    int64 partition_id = 1;
    // Source partition last stable offset (LSO)
    int64 source_last_stable_offset = 2;
    // Source partition high watermark (HWM)
    int64 source_high_watermark = 3;
    // Shadowed partition high watermark (HWM)
    int64 high_watermark = 4;
}

/* Enums */
// `ShadowLinkState` represents the operational state of a shadow link.
enum ShadowLinkState {
    // Unspecified
    SHADOW_LINK_STATE_UNSPECIFIED = 0;
    // Shadow link is active
    SHADOW_LINK_STATE_ACTIVE = 1;
    // Redpanda paused the shadow link
    SHADOW_LINK_STATE_PAUSED = 2;
}
// `ScramMechanism` specifies the SASL SCRAM authentication mechanism.
enum ScramMechanism {
    SCRAM_MECHANISM_UNSPECIFIED = 0;
    // SCRAM-SHA-256
    SCRAM_MECHANISM_SCRAM_SHA_256 = 1;
    // SCRAM-SHA-512
    SCRAM_MECHANISM_SCRAM_SHA_512 = 2;
}
// `PatternType` defines how name patterns are matched in filters.
enum PatternType {
    PATTERN_TYPE_UNSPECIFIED = 0;
    // Matches the filter exactly
    PATTERN_TYPE_LITERAL = 1;
    // Matches anything that starts with the filter
    PATTERN_TYPE_PREFIX = 2;
}
// `FilterType` determines whether a filter includes or excludes matches.
enum FilterType {
    FILTER_TYPE_UNSPECIFIED = 0;
    // Includes items that match the filter
    FILTER_TYPE_INCLUDE = 1;
    // Excludes items that match the filter
    FILTER_TYPE_EXCLUDE = 2;
}

// `TaskState` represents the operational state of a shadow link task.
enum TaskState {
    TASK_STATE_UNSPECIFIED = 0;
    // Task is active
    TASK_STATE_ACTIVE = 1;
    // Redpanda paused the task
    TASK_STATE_PAUSED = 2;
    // Task cannot communicate with the source cluster
    TASK_STATE_LINK_UNAVAILABLE = 3;
    // Task is not running
    TASK_STATE_NOT_RUNNING = 4;
    // Task is faulted
    TASK_STATE_FAULTED = 5;
}
// `ShadowTopicState` represents the operational state of a shadow topic.
enum ShadowTopicState {
    SHADOW_TOPIC_STATE_UNSPECIFIED = 0;
    // Shadow topic is active
    SHADOW_TOPIC_STATE_ACTIVE = 1;
    // Shadow topic encountered a fault
    SHADOW_TOPIC_STATE_FAULTED = 2;
    // Redpanda paused the shadow topic
    SHADOW_TOPIC_STATE_PAUSED = 3;
    // Shadow topic is in the process of failing over
    SHADOW_TOPIC_STATE_FAILING_OVER = 4;
    // Shadow topic completed failover successfully
    SHADOW_TOPIC_STATE_FAILED_OVER = 5;
    // Redpanda is promoting the shadow topic
    SHADOW_TOPIC_STATE_PROMOTING = 6;
    // Redpanda promoted the shadow topic successfully
    SHADOW_TOPIC_STATE_PROMOTED = 7;
}
